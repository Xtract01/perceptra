[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "perceptra"
version = "0.1.0"
description = "Local, reproducible product-review sentiment analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "vaderSentiment>=3.3.2,<4",
    "langdetect>=1.0.9,<2",
    "nltk>=3.9.1,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
collectors = ["google-api-python-client>=2,<3", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["perceptra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".venv/pytest-cache"
